
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soft Rose Modern Trade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background: #020617;
        margin: 0;
        overflow-x: hidden;
        color: white;
      }

      .bg-blob {
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        filter: blur(120px);
        z-index: -1;
        opacity: 0.3;
        animation: move 25s infinite alternate ease-in-out;
      }
      .blob-1 { background: #881337; top: -200px; right: -200px; }
      .blob-2 { background: #4c1d95; bottom: -200px; left: -200px; animation-delay: -7s; }
      .blob-3 { background: #db2777; top: 30%; left: 20%; animation-delay: -12s; }

      @keyframes move {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(150px, 150px) scale(1.3); }
      }

      .glass-card-dark {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .glass-input-dark {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        transition: all 0.3s ease;
      }
      .glass-input-dark:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(244, 63, 94, 0.5);
        box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
      }

      .glass-sidebar-inner {
        background: rgba(15, 23, 42, 0.2);
        backdrop-filter: blur(40px);
        border-left: 1px solid rgba(255, 255, 255, 0.05);
      }

      .glass-header-inner {
        background: rgba(2, 6, 23, 0.3);
        backdrop-filter: blur(25px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(244, 63, 94, 0.4);
      }

      .active-glow {
        box-shadow: 0 0 20px rgba(190, 18, 60, 0.3);
      }

      /* Ticker Animation */
      @keyframes ticker-scroll {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-ticker {
        display: inline-block;
        white-space: nowrap;
        animation: ticker-scroll 30s linear infinite;
      }
      .ticker-container {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
  <body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
